<!DOCTYPE html>
<html lang="ru">
<head>
<title>ДЕМО без GPS: Location AR: места только в HTML</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/three.js/build/ar-threex-location-only.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0;overflow:hidden">
<!-- ВАЖНО: замените latitude/longitude на координаты рядом с вами (https://www.latlong.net/) -->
<a-scene vr-mode-ui="enabled: false" embedded
         arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
         renderer="antialias: true; alpha: true">
  <a-camera look-controls-enabled="false" arjs-device-orientation-controls="smoothingFactor: 0.1" gps-new-camera="gpsMinDistance: 5; simulateLatitude: 51.049; simulateLongitude: -0.723"></a-camera>

  <!-- "Магнемайт" из примитивов: серое тело + красный и синий магниты + глаз -->
  <a-entity gps-new-entity-place="latitude: 51.04909; longitude: -0.723" scale="5 5 5"
               animation="property: rotation; to: 0 360 0; dur: 6000; loop: true; easing: linear">
    <a-sphere radius="0.6" color="#9aa5b1" metalness="0.6"></a-sphere>
    <a-sphere radius="0.18" position="0 0 0.55" color="#ffffff"></a-sphere>
    <a-sphere radius="0.08" position="0 0 0.7" color="#111111"></a-sphere>
    <a-box width="0.35" height="0.35" depth="0.35" position="-0.85 0 0" color="#d62828"></a-box>
    <a-box width="0.35" height="0.35" depth="0.35" position="0.85 0 0" color="#1d4ed8"></a-box>
  </a-entity>
</a-scene>
</body>
</html>
