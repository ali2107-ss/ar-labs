<!DOCTYPE html>
<html lang="ru">
<head>
<title>ДЕМО без GPS: Location AR: места только в HTML</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../../libs/aframe.min.js?v=3"></script>
<script src="../../libs/aframe-look-at-component.min.js?v=3"></script>
<script src="../../libs/ar-threex-location-only.js?v=3"></script>
<script src="../../libs/aframe-ar.js?v=3"></script>
<link rel="stylesheet" href="../../libs/ar-mobile-controls.css">
<script src="../../libs/ar-mobile-controls.js"></script>
</head>
<body style="margin:0;overflow:hidden">
<div id="info" style="position:fixed;top:0;left:0;right:0;z-index:10;padding:10px 14px;text-align:center;color:#fff;background:rgba(0,0,0,.6);font:15px system-ui,sans-serif">Загрузка…</div>
<script>
(function () {
  var info = document.getElementById('info');
  var say = function (t) { info.textContent = t; };
  // не загрузился какой-то скрипт
  window.addEventListener('error', function (e) {
    if (e.target && e.target.src) say('Не загрузился скрипт: ' + e.target.src.split('/').pop());
    else say('Ошибка: ' + e.message);
  }, true);
  window.addEventListener('load', function () {
    var ok = window.AFRAME && AFRAME.components['gps-new-camera'] && AFRAME.components['gps-new-entity-place'];
    if (!ok) return say('Компоненты AR.js не загрузились. Проверьте интернет и обновите страницу');
    say(window.DEMO_POS || document.title.indexOf('ДЕМО') === 0
        ? 'ДЕМО без GPS. Объект ~10 м на север: поворачивайтесь с телефоном'
        : 'Жду GPS…');
    var cam = document.querySelector('[gps-new-camera]');
    cam.addEventListener('gps-camera-update-position', function () { say('GPS получен. Ищите объект: смотрите по сторонам'); });
    setTimeout(function () { if (info.textContent === 'Жду GPS…') say('GPS не получен: откройте в Safari, включите геолокацию или используйте demo.html'); }, 20000);
  });
})();
</script>
<button class="ar-sensor-button" type="button" data-ar-sensor-button>Включить датчики</button>

<!-- ВАЖНО: замените latitude/longitude на координаты рядом с вами (https://www.latlong.net/) -->
<a-scene vr-mode-ui="enabled: false" embedded
         arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
         renderer="antialias: true; alpha: true">
  <a-camera look-controls-enabled="false" arjs-device-orientation-controls="smoothingFactor: 0.1" gps-new-camera="gpsMinDistance: 5; simulateLatitude: 51.049; simulateLongitude: -0.723"></a-camera>

  <!-- "Магнемайт" из примитивов: серое тело + красный и синий магниты + глаз -->
  <a-entity gps-new-entity-place="latitude: 51.04909; longitude: -0.723" scale="5 5 5"
               animation="property: rotation; to: 0 360 0; dur: 6000; loop: true; easing: linear">
    <a-sphere radius="0.6" color="#9aa5b1" metalness="0.6"></a-sphere>
    <a-sphere radius="0.18" position="0 0 0.55" color="#ffffff"></a-sphere>
    <a-sphere radius="0.08" position="0 0 0.7" color="#111111"></a-sphere>
    <a-box width="0.35" height="0.35" depth="0.35" position="-0.85 0 0" color="#d62828"></a-box>
    <a-box width="0.35" height="0.35" depth="0.35" position="0.85 0 0" color="#1d4ed8"></a-box>
  </a-entity>
</a-scene>
</body>
</html>
