<!DOCTYPE html>
<html lang="ru">
<head>
<title>Location AR: места рядом (динамически)</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../../libs/aframe.min.js?v=3"></script>
<script src="../../libs/aframe-look-at-component.min.js?v=3"></script>
<script src="../../libs/ar-threex-location-only.js?v=3"></script>
<script src="../../libs/aframe-ar.js?v=3"></script>
<link rel="stylesheet" href="../../libs/ar-mobile-controls.css">
<script src="../../libs/ar-mobile-controls.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
  #status { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: 12px 16px;
            text-align: center; color: #fff; background: rgba(0,0,0,.55); font-size: 15px; }
</style>
<script src="script.js"></script>
</head>
<body>
<div id="status">Определяю позицию…</div>
<button class="ar-sensor-button" type="button" data-ar-sensor-button>Включить датчики</button>
<!-- Не показывать объекты ближе 5 м: GPS рядом с камерой нестабилен. -->
<a-scene vr-mode-ui="enabled: false" embedded
         arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
         renderer="antialias: true; alpha: true">
  <a-camera look-controls-enabled="false" arjs-device-orientation-controls="smoothingFactor: 0.1" gps-new-camera="gpsMinDistance: 5; positionMinAccuracy: 1000"></a-camera>
</a-scene>
</body>
</html>
