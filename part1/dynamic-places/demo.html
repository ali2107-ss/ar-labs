<!DOCTYPE html>
<html lang="ru">
<head>
<title>ДЕМО без GPS: Location AR: места рядом (динамически)</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/three.js/build/ar-threex-location-only.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
  #status { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: 12px 16px;
            text-align: center; color: #fff; background: rgba(0,0,0,.55); font-size: 15px; }
</style>
<script>window.DEMO_POS = { latitude: 51.049, longitude: -0.723 };</script>
<script src="script.js"></script>
</head>
<body>
<div id="status">Определяю позицию…</div>
<!-- gpsMinDistance: не показывать объекты ближе 40 м (аналог minDistance из статьи) -->
<a-scene vr-mode-ui="enabled: false" embedded
         arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
         renderer="antialias: true; alpha: true">
  <a-camera look-controls-enabled="false" arjs-device-orientation-controls="smoothingFactor: 0.1" gps-new-camera="gpsMinDistance: 5; simulateLatitude: 51.049; simulateLongitude: -0.723"></a-camera>
</a-scene>
</body>
</html>
