<!DOCTYPE html>
<html lang="ru">
<head>
<title>Location AR: места из JavaScript</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/three.js/build/ar-threex-location-only.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
</head>
<body>
<div class="info" id="info">Определяю позицию…</div>
<a-scene vr-mode-ui="enabled: false" embedded
         arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
         renderer="antialias: true; alpha: true">
  <a-camera look-controls-enabled="false" arjs-device-orientation-controls="smoothingFactor: 0.1" gps-new-camera="gpsMinDistance: 5; positionMinAccuracy: 1000"></a-camera>
</a-scene>
<button class="switch" data-action="change-model">Сменить модель</button>
<button class="switch" id="motion" style="bottom:90px">Включить датчики</button>
</body>
</html>
