<!DOCTYPE html>
<html lang="ru">
<head>
<title>ДЕМО без GPS: Location AR: места из JavaScript</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../../libs/aframe.min.js?v=3"></script>
<script src="../../libs/aframe-look-at-component.min.js?v=3"></script>
<script src="../../libs/ar-threex-location-only.js?v=3"></script>
<script src="../../libs/aframe-ar.js?v=3"></script>
<link rel="stylesheet" href="../../libs/ar-mobile-controls.css">
<link rel="stylesheet" href="style.css">
<script src="../../libs/ar-mobile-controls.js"></script>
<script>window.DEMO_POS = { latitude: 51.049, longitude: -0.723 };</script>
<script src="script.js"></script>
</head>
<body>
<div class="info" id="info">Определяю позицию…</div>
<a-scene vr-mode-ui="enabled: false" embedded
         arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
         renderer="antialias: true; alpha: true">
  <a-camera look-controls-enabled="false" arjs-device-orientation-controls="smoothingFactor: 0.1" gps-new-camera="gpsMinDistance: 5; simulateLatitude: 51.049; simulateLongitude: -0.723"></a-camera>
</a-scene>
<button class="switch" data-action="change-model">Сменить модель</button>
<button class="ar-sensor-button" type="button" data-ar-sensor-button style="bottom:calc(90px + env(safe-area-inset-bottom))">Включить датчики</button>
</body>
</html>
